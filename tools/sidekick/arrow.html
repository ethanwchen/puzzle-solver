<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Sidekick arrow</title>
<style>html, body { margin:0; height:100%; background:transparent; overflow:hidden; pointer-events:none; } svg { width:100%; height:100%; }</style>
</head>
<body>
<!-- Click-through arrow for a drag step: from the source item to its destination. -->
<svg id="s"><defs><marker id="h" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker></defs>
  <path id="p" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 7" marker-end="url(#h)"/>
</svg>
<script>
const q = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const [ax, ay] = q.a, [cx, cy] = q.c, mx = (ax + cx) / 2, my = (ay + cy) / 2 - Math.min(80, Math.hypot(cx - ax, cy - ay) * 0.2);
document.getElementById('p').setAttribute('d', `M${ax},${ay} Q${mx},${my} ${cx},${cy}`);
</script>
</body>
</html>
