<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Sidekick answer</title>
<style>
  /* A floating answer card: drag by the top bar, resize from any edge (text scales), × to close. */
  :root { --ok:#22c55e; --ink:#06240f; }
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; font:12px/1.2 -apple-system, BlinkMacSystemFont, sans-serif; }
  #card { position:absolute; inset:0; display:flex; flex-direction:column; background:rgba(12,30,18,.92); border:1.5px solid var(--ok); border-radius:10px; overflow:hidden; box-shadow:0 6px 20px rgba(0,0,0,.4); }
  #bar { -webkit-app-region: drag; display:flex; align-items:center; gap:6px; padding:3px 4px 3px 8px; background:var(--ok); color:var(--ink); font-weight:700; font-size:11px; cursor:grab; flex:none; }
  #bar .sp { flex:1; }
  #bar button { -webkit-app-region: no-drag; border:0; background:rgba(0,0,0,.16); color:var(--ink); border-radius:5px; padding:1px 6px; font-size:11px; cursor:pointer; }
  #t { flex:1; display:flex; align-items:center; justify-content:center; text-align:center; padding:2px 10px; color:#eafff0; font-weight:800;
       font-size: clamp(12px, calc((100vh - 22px) * .5), 72px); word-break:break-word; cursor:pointer; transition: filter .15s; }
  .blur #t { filter: blur(9px); }
  #hint { position:absolute; bottom:3px; right:8px; color:#9adbb0; font-size:10px; }
  .open #hint { display:none; }
</style>
</head>
<body>
<div id="card">
  <div id="bar"><span id="n"></span><span class="sp"></span><button id="copy">copy</button><button id="x" title="Close">×</button></div>
  <div id="t" title="Click to reveal / hide"></div>
  <span id="hint">click to reveal</span>
</div>
<script>
const q = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const $ = id => document.getElementById(id);
$('t').textContent = q.text;
$('n').textContent = (q.lane === 'quick' ? '⚡ ' : '') + (q.n ? '📍 ' + q.n : 'answer');
document.body.className = q.open ? 'open' : 'blur';
$('t').onclick = () => { document.body.classList.toggle('open'); document.body.classList.toggle('blur'); };
$('copy').onclick = () => { sk.copy(q.text); $('copy').textContent = 'copied'; setTimeout(() => $('copy').textContent = 'copy', 900); };
$('x').onclick = () => sk.callout('close', q.id);
</script>
</body>
</html>
