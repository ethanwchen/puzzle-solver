<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Novel: The Signal</title><link rel="stylesheet" href="../variants/common.css">
<style>#lamp{width:120px;height:120px;border-radius:50%;background:#2a1a12;box-shadow:inset 0 0 20px #000;transition:none}#lamp.on{background:#ffd98a;box-shadow:0 0 40px 12px rgba(255,210,120,.6)}</style></head>
<body><main id="stage"></main><script type="module">
import { puzzle } from './novel.js';
const MORSE = { A: '.-', M: '--', O: '---', S: '...' };
await puzzle({ code: 'NOVEL · D', title: 'The Signal',
  clue: 'PRACTICE. The lamp repeats a name, over and over. Find where the book says this person died.',
  hint: 'WATCH THE LAMP · TYPE THE PAGE NUMBER · CONTINUE TO SUBMIT',
  body: `<div id="lamp"></div>`, fields: ['page of death'], answers: ['277'] });
// AMOS in Morse, 220 ms unit, looping with a 7-unit word gap (no hover needed)
const U = 220, seq = [];
'AMOS'.split('').forEach((ch, li) => { if (li) seq.push([0, 3]); MORSE[ch].split('').forEach((s, si) => { if (si) seq.push([0, 1]); seq.push([1, s === '-' ? 3 : 1]); }); });
seq.push([0, 7]);
let i = 0; const lamp = document.getElementById('lamp');
(function step() { const [on, u] = seq[i]; lamp.classList.toggle('on', !!on); i = (i + 1) % seq.length; setTimeout(step, u * U); })();
</script></body></html>
