<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>G9 variant T: The Tunnels (plate artwork)</title>
<link rel="stylesheet" href="common.css">
<style>
  #plate { position:relative; filter:drop-shadow(0 6px 18px #000a); }
  #plate svg.art { display:block; }
  #cells { position:absolute; display:grid; }
  .c { position:relative; cursor:pointer; }
  .c.start::after { content:''; position:absolute; inset:8%; border-radius:4px; box-shadow:0 0 0 3px var(--cyan), 0 0 18px rgba(79,200,232,.8); pointer-events:none; }
  .c.lit::after { content:''; position:absolute; inset:0; background:radial-gradient(circle, rgba(255,214,120,.42), rgba(255,214,120,0) 70%); pointer-events:none; }
  .c.mark::before { content:''; position:absolute; left:50%; top:50%; width:32%; height:32%; transform:translate(-50%,-50%); border-radius:50%; background:rgba(230,30,60,.88); box-shadow:0 0 0 2px #fff5; pointer-events:none; z-index:2; }
  #cap { margin-top:10px; font:600 10px Arial; letter-spacing:.22em; color:var(--dim); text-align:center; }
</style>
</head>
<body>
<main id="stage"><div><div id="plate"></div><div id="cap"></div></div></main>
<script type="module">
// The tunnels as a PRINTED PLATE rather than crisp vector tiles: paper grain, uneven development, ink bleed,
// a vignette and a small press skew — the look of a scanned book plate (R3 card art is the p254 tunnel plate).
// The maze itself is identical to game9m/game9z, so a failure here is a READER failure, not a solving failure.
// URL params (unspecified = seeded random):
//   tone=sepia|blueprint|xray   paper + ink palette
//   rows/cols/n                 size (default 9x7)
//   grain=0..1                  speckle density (default .5)
//   vignette=0..1               corner darkening (default .5)
//   bleed=0..1                  ink spread + edge softness (default .4)
//   rot=deg                     press skew of the whole plate (default ±1.4)
//   exits=1..4  lit=1  loops=0..3  start=bottom|any   seed, truth=1
import { R, pick, shuffle, sha, $, frame, onSubmit, params } from './common.js';
import { makeMaze } from './maze_gen.js';
const P = k => params.get(k);
const TONE = P('tone') || pick(['sepia', 'blueprint', 'xray']);
const NR = Number(P('rows') || P('n')) || 9;
const NC = Number(P('cols') || P('n')) || 7;
const GRAIN = P('grain') == null ? 0.5 : Number(P('grain'));
const VIG = P('vignette') == null ? 0.5 : Number(P('vignette'));
const BLEED = P('bleed') == null ? 0.4 : Number(P('bleed'));
const ROT = P('rot') == null ? (R() * 2.8 - 1.4) : Number(P('rot'));
const LIT = P('lit') === '1';
const M = makeMaze({ rows: NR, cols: NC, exits: Number(P('exits') || pick([1, 2, 3])), lit: LIT,
  loops: Number(P('loops') || 0), startMode: P('start') || 'bottom' });
const { open, start, routeSet } = M;

const PAL = {
  sepia:     { paper: '#d6c9b0', ink: '#2b2118', warm: '#8a6b42', label: 'PLATE XI · THE TUNNELS' },
  blueprint: { paper: '#17344f', ink: '#d2e6f7', warm: '#0b2033', label: 'SURVEY SHEET 4 · TUNNELS' },
  xray:      { paper: '#0c0c0f', ink: '#c8d2db', warm: '#1b2a33', label: 'SCAN 254 · SUBSURFACE' },
}[TONE];

frame({ code: 'R3 · G9', title: 'The Tunnels',
  clue: 'A plate of the tunnels, printed badly. Reach the top edge. One way out. Walk the space between the walls and mark every tile of your route.' + (LIT ? ' Some tunnels are lit for you.' : ''),
  hint: 'CLICK A TILE TO MARK IT · CLICK AGAIN TO REMOVE' });

const T = Math.max(44, Math.min(92, Math.floor(620 / Math.max(NR, NC))));
const W = NC * T, H = NR * T;
const WALLW = Math.max(5, T * 0.13);
const PAD = Math.ceil(WALLW * 0.6);   // just enough that the boundary strokes aren't half-clipped
const PW = W + 2 * PAD, PH = H + 2 * PAD;
const jit = m => (R() * 2 - 1) * m;                     // hand-press wobble

// every wall segment of the maze, drawn with a wobbling stroke
function wallPaths() {
  let d = '';
  for (let r = 0; r < NR; r++) for (let c = 0; c < NC; c++) {
    const o = open[r][c], x = c * T, y = r * T;
    const seg = { U: [[x, y], [x + T, y]], L: [[x, y], [x, y + T]] };
    if (r === NR - 1) seg.D = [[x, y + T], [x + T, y + T]];
    if (c === NC - 1) seg.R = [[x + T, y], [x + T, y + T]];
    for (const s in seg) {
      if (o.has(s)) continue;
      const [[ax, ay], [bx, by]] = seg[s], j = T * 0.035;
      const mx = (ax + bx) / 2 + jit(j), my = (ay + by) / 2 + jit(j);
      d += `M${(ax + jit(j)).toFixed(1)} ${(ay + jit(j)).toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${(bx + jit(j)).toFixed(1)} ${(by + jit(j)).toFixed(1)} `;
    }
  }
  return d;
}
let speck = '';
for (let i = 0; i < Math.round(GRAIN * W * H / 420); i++)
  speck += `<circle cx="${(R() * W).toFixed(0)}" cy="${(R() * H).toFixed(0)}" r="${(0.5 + R() * 1.7).toFixed(1)}" fill="${PAL.ink}" opacity="${(0.08 + R() * 0.3).toFixed(2)}"/>`;
let blotch = '';
for (let i = 0; i < 7; i++) // uneven development: soft light/dark patches
  blotch += `<ellipse cx="${(R() * W).toFixed(0)}" cy="${(R() * H).toFixed(0)}" rx="${(W * (0.1 + R() * 0.25)).toFixed(0)}" ry="${(H * (0.1 + R() * 0.25)).toFixed(0)}" fill="${R() < 0.5 ? PAL.ink : '#fff'}" opacity="${(0.03 + R() * 0.06).toFixed(3)}"/>`;

$('plate').innerHTML = `
<svg class="art" width="${PW}" height="${PH}" viewBox="0 0 ${PW} ${PH}">
  <defs>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="g2"><feFuncA type="linear" slope="${(0.10 + GRAIN * 0.16).toFixed(3)}"/></feComponentTransfer>
      <feComposite in="g2" in2="SourceGraphic" operator="over"/>
    </filter>
    <filter id="bleed" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="${(BLEED * T * 0.14).toFixed(2)}" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="${(0.3 + BLEED * 1.5).toFixed(2)}"/>
    </filter>
    <radialGradient id="vig" cx="50%" cy="48%" r="72%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="${(VIG * 0.62).toFixed(2)}"/>
    </radialGradient>
  </defs>
  <rect width="${PW}" height="${PH}" fill="${PAL.paper}"/>
  <g filter="url(#paper)"><rect width="${PW}" height="${PH}" fill="${PAL.paper}"/><g transform="translate(${PAD},${PAD})">${blotch}</g></g>
  <g transform="translate(${PAD},${PAD})" filter="url(#bleed)"><path d="${wallPaths()}" stroke="${PAL.ink}" stroke-width="${WALLW}" stroke-linecap="round" fill="none" opacity=".94"/></g>
  <g transform="translate(${PAD},${PAD})">${speck}</g>
  <rect width="${PW}" height="${PH}" fill="url(#vig)"/>
</svg>
<div id="cells" style="left:${PAD}px; top:${PAD}px; width:${W}px; height:${H}px; grid-template-columns:repeat(${NC}, ${T}px); grid-template-rows:repeat(${NR}, ${T}px)"></div>`;
$('plate').style.transform = `rotate(${(+ROT).toFixed(2)}deg)`;
$('cap').textContent = `${PAL.label} · ${NC}×${NR}`;

const startK = `${start[0]},${start[1]}`;
const marked = new Set([startK]);
function render() {
  let h = '';
  for (let r = 0; r < NR; r++) for (let c = 0; c < NC; c++) {
    const k = `${r},${c}`;
    h += `<div class="c ${k === startK ? 'start' : ''} ${M.lit.has(k) ? 'lit' : ''} ${marked.has(k) && k !== startK ? 'mark' : ''}" data-k="${k}"></div>`;
  }
  $('cells').innerHTML = h;
  $('progress').textContent = `${marked.size} MARKED`;
}
$('plate').addEventListener('click', e => {
  const t = e.target.closest('.c'); if (!t) return;
  const k = t.dataset.k; if (k === startK) return;
  marked.has(k) ? marked.delete(k) : marked.add(k); render();
});
render();
if (P('truth') === '1') window.__truth = M.truth({ tone: TONE, grain: GRAIN, vignette: VIG, bleed: BLEED, rot: +(+ROT).toFixed(2) });

const target = await sha([...routeSet].sort().join('|'));
onSubmit(() => marked.size > 1, async () => {
  const ok = await sha([...marked].sort().join('|')) === target;
  let hit = 0; for (const k of marked) if (routeSet.has(k)) hit++;
  const extra = marked.size - hit;
  return { pct: ok ? 100 : Math.round(100 * Math.max(0, hit - extra) / routeSet.size),
    notes: [ok ? 'Route complete.' : `${hit} of ${routeSet.size} route tiles marked, ${extra} extra.`] };
});
</script>
</body>
</html>
